<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisSolicitud" *ngIf="puthisSolicitud.visible"
                (selected)="processputhissolicitudSelected($event)" (cleared)="cleanputhissolicitud()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhissolicitudChange')"
                (searched)="doSearchAction('puthisSolicitud')"></imes-lensesearch>
            <imes-preload [field]="ptupuevcTipoIdentificacion" *ngIf="ptupuevcTipoIdentificacion.visible" (selected)="onptupuevctipoidentificacionChange()"></imes-preload>
            <imes-input-string [field]="ptupuNumIdentificacion" *ngIf="ptupuNumIdentificacion.visible" (valueChanged)="onptupunumidentificacionChange()"></imes-input-string>
            <imes-input-radio [field]="puTitularBeneficios" *ngIf="puTitularBeneficios.visible" (valueChanged)="onputitularbeneficiosChange()"></imes-input-radio>
            <imes-input-radio [field]="ptuDiplomatico" *ngIf="ptuDiplomatico.visible"></imes-input-radio>
            <div class="card argumentGroup" *ngIf="isGroupVisible('5')">
                <div class="card-header">{{getGroupAlias('5')}}</div>
                <div class="card-body">
                    <imes-input-string [field]="ptupuPrimerNombre" *ngIf="ptupuPrimerNombre.visible"></imes-input-string>
                    <imes-input-string [field]="ptupuSegundoNombre" *ngIf="ptupuSegundoNombre.visible"></imes-input-string>
                    <imes-input-string [field]="ptupuPrimerApellido" *ngIf="ptupuPrimerApellido.visible"></imes-input-string>
                    <imes-input-string [field]="ptupuSegundoApellido" *ngIf="ptupuSegundoApellido.visible"></imes-input-string>
                    <imes-input-date [field]="ptupuFechaNacimiento" *ngIf="ptupuFechaNacimiento.visible"></imes-input-date>
                    <imes-input-definedselection [field]="ptupuGenero" *ngIf="ptupuGenero.visible"></imes-input-definedselection>
                    <imes-input-radio [field]="ptupuIndicadorExtranjero" *ngIf="ptupuIndicadorExtranjero.visible" (valueChanged)="onptupuindicadorextranjeroChange()"></imes-input-radio>
                    <imes-preload [field]="ptupuevcDepartamentoNac" *ngIf="ptupuevcDepartamentoNac.visible" (selected)="onptupuevcdepartamentonacChange()"></imes-preload>
                    <imes-preload [field]="ptupuevcMunicipioNac" *ngIf="ptupuevcMunicipioNac.visible"></imes-preload>
                    <imes-preload [field]="ptupuevcEstadoCivil" *ngIf="ptupuevcEstadoCivil.visible"></imes-preload>
                </div>
            </div>
            <imes-input-string [field]="ptupuCorreoElectronico" *ngIf="ptupuCorreoElectronico.visible"></imes-input-string>
            <div class="card argumentGroup" *ngIf="isGroupVisible('7')">
                <div class="card-header">{{getGroupAlias('7')}}</div>
                <div class="card-body">
                    <imes-input-string [field]="ptupuatrRazonSocial" *ngIf="ptupuatrRazonSocial.visible"></imes-input-string>
                </div>
            </div>
            <div class="card argumentGroup" *ngIf="isGroupVisible('8')">
                <div class="card-header">{{getGroupAlias('8')}}</div>
                <div class="card-body">
                    <div class="card argumentGroup" *ngIf="isGroupVisible('8_0')">
                        <div class="card-header">{{getGroupAlias('8_0')}}</div>
                        <div class="card-body">
                            <imes-input-definedselection [field]="ptuDireccionesXClass" *ngIf="ptuDireccionesXClass.visible" (valueChanged)="onptudireccionesxclassChange()"></imes-input-definedselection>
                            <imes-input-string [field]="ptupuDireccionCompleta" *ngIf="ptupuDireccionCompleta.visible"></imes-input-string>
                            <imes-preload [field]="ptupuevcDepartamento" *ngIf="ptupuevcDepartamento.visible" (selected)="onptupuevcdepartamentoChange()"></imes-preload>
                            <imes-preload [field]="ptupuevcMunicipio" *ngIf="ptupuevcMunicipio.visible"></imes-preload>
                            <imes-input-radio [field]="ptupuRural" *ngIf="ptupuRural.visible"></imes-input-radio>
                            <imes-input-string [field]="ptupuTelefonoFijo" *ngIf="ptupuTelefonoFijo.visible"></imes-input-string>
                            <imes-input-string [field]="ptupuTelefonoCelular" *ngIf="ptupuTelefonoCelular.visible"></imes-input-string>
                        </div>
                    </div>
                    <imes-input-radio [field]="ptReplicarDireccion" *ngIf="ptReplicarDireccion.visible" (valueChanged)="onptreplicardireccionChange()"></imes-input-radio>
                    <div class="card argumentGroup" *ngIf="isGroupVisible('8_2')">
                        <div class="card-header">{{getGroupAlias('8_2')}}</div>
                        <div class="card-body">
                            <imes-input-string [field]="ptupDCDireccionCompleta" *ngIf="ptupDCDireccionCompleta.visible"></imes-input-string>
                            <imes-preload [field]="ptupDCDepartamento" *ngIf="ptupDCDepartamento.visible" (selected)="onptupdcdepartamentoChange()"></imes-preload>
                            <imes-preload [field]="ptupDCMunicipio" *ngIf="ptupDCMunicipio.visible"></imes-preload>
                            <imes-input-radio [field]="ptupDCRural" *ngIf="ptupDCRural.visible"></imes-input-radio>
                            <imes-input-string [field]="ptupDCTelefonoFijo" *ngIf="ptupDCTelefonoFijo.visible"></imes-input-string>
                            <imes-input-string [field]="ptupDCTelefonoCelular" *ngIf="ptupDCTelefonoCelular.visible"></imes-input-string>
                        </div>
                    </div>
                </div>
            </div>






        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
