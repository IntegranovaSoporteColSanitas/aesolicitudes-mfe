<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h3 class="title">{{title}}</h3>

        <div class="master" [ngClass]="cssClasses">
            <h3 class="title">{{master.title}}</h3>
            <div class="iiuRegion" [ngClass]="master.cssClasses">
                <imes-actionsnavigations [queryIU]="master"></imes-actionsnavigations>
                <!-- Display Set elements -->
                <div class="card displaySet">
                    <div class="card-header">{{master.title}}</div>
                    <div class="card-body">
                        <imes-input-string [field]="master.dseSolicitudAeusolicitudesNumerousolicitud" *ngIf="master.dseSolicitudAeusolicitudesNumerousolicitud.visible"></imes-input-string>
                        <imes-input-string [field]="master.dseDrvNumContrato" *ngIf="master.dseDrvNumContrato.visible"></imes-input-string>
                        <imes-input-string [field]="master.dsePersonadrvTipoNumDoc" *ngIf="master.dsePersonadrvTipoNumDoc.visible"></imes-input-string>
                        <imes-input-string [field]="master.dsePersonadrvNombreCompleto" *ngIf="master.dsePersonadrvNombreCompleto.visible"></imes-input-string>
                        <imes-input-definedselection [field]="master.dseEstado" *ngIf="master.dseEstado.visible"></imes-input-definedselection>
                        <imes-input-definedselection [field]="master.dseTipo" *ngIf="master.dseTipo.visible"></imes-input-definedselection>
                        <imes-input-string [field]="master.dseDescripcion" *ngIf="master.dseDescripcion.visible"></imes-input-string>
                        <imes-input-date [field]="master.dseFechaSubida" *ngIf="master.dseFechaSubida.visible"></imes-input-date>
                        <imes-input-string [field]="master.dseIdDocEnGestor" *ngIf="master.dseIdDocEnGestor.visible"></imes-input-string>
                        <imes-input-string [field]="master.dseResultadoSubida" *ngIf="master.dseResultadoSubida.visible"></imes-input-string>
                        <imes-input-string [field]="master.dseEmailEnvioDevuelto" *ngIf="master.dseEmailEnvioDevuelto.visible"></imes-input-string>
                        <imes-input-numeric [field]="master.dseNumDescargas" *ngIf="master.dseNumDescargas.visible"></imes-input-numeric>
                    </div>
                </div>
                <div *ngIf="master.showInstanceLog" class="iiuLogNavigation">
                    <a (click)="master.onNavigateLoginstance()">{{master.langMng.translateText('app_INSTANCELOG', 'Log Instance')}}</a>
                </div>
            </div>
        </div>
        <div class="col-12 mdiuButtons">
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_CLOSE', '')}}</button>
        </div>
    </ng-container>
</form>
