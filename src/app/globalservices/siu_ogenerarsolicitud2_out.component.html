<form novalidate>
    <h2 class="title">{{title}}</h2>
    <div class="siuRegion" [ngClass]="cssClasses">
        <imes-input-string [field]="ptupsuNumSolicitud" *ngIf="ptupsuNumSolicitud.visible"></imes-input-string>
        <imes-input-string [field]="ptupsuErrorWS" *ngIf="ptupsuErrorWS.visible"></imes-input-string>
    </div>
    <div class="col-12 iiuButtons">
        <button type="button" class="btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_CLOSE', '')}}</button>
    </div>
</form>
