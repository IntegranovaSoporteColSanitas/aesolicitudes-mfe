<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-preload [field]="ptupuevcEPS" *ngIf="ptupuevcEPS.visible"></imes-preload>
            <imes-preload [field]="ptupuevcParentesco" *ngIf="ptupuevcParentesco.visible"></imes-preload>
            <imes-preload [field]="ptupuevcCompanyia" *ngIf="ptupuevcCompanyia.visible" (selected)="onptupuevccompanyiaChange()"></imes-preload>
            <imes-input-date [field]="ptupuFechaAntiguedad" *ngIf="ptupuFechaAntiguedad.visible"></imes-input-date>
            <imes-input-radio [field]="ptupuBebeGestante" *ngIf="ptupuBebeGestante.visible"></imes-input-radio>
            <imes-input-string [field]="ptupucodigoBancoRep" *ngIf="ptupucodigoBancoRep.visible"></imes-input-string>
            <imes-input-radio [field]="ptupePolizaInternacional" *ngIf="ptupePolizaInternacional.visible"></imes-input-radio>

        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
