<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-input-date [field]="ptupuatrFechaUltRegla" *ngIf="ptupuatrFechaUltRegla.visible"></imes-input-date>
            <imes-input-numeric [field]="ptupuatrNumHijos" *ngIf="ptupuatrNumHijos.visible"></imes-input-numeric>
            <imes-input-numeric [field]="ptupuatrNumCuotas" *ngIf="ptupuatrNumCuotas.visible"></imes-input-numeric>
            <imes-preload [field]="ptuInstitucionNeo" *ngIf="ptuInstitucionNeo.visible"></imes-preload>
            <imes-lensesearch [field]="puthisUsuario" *ngIf="puthisUsuario.visible"
                (selected)="processputhisusuarioSelected($event)" (cleared)="cleanputhisusuario()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisusuarioChange')"
                (searched)="doSearchAction('puthisUsuario')"></imes-lensesearch>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
