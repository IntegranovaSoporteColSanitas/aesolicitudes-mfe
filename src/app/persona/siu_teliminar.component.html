<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisPersona" *ngIf="puthisPersona.visible"
                (selected)="processputhispersonaSelected($event)" (cleared)="cleanputhispersona()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhispersonaChange')"
                (searched)="doSearchAction('puthisPersona')"></imes-lensesearch>
            <imes-lensesearch [field]="ptUsuario" *ngIf="ptUsuario.visible"
                (selected)="processptusuarioSelected($event)" (cleared)="cleanptusuario()"
                (keypressLenseSearch)="onKeypressLenseSearch('onptusuarioChange')"
                (searched)="doSearchAction('ptUsuario')"></imes-lensesearch>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
