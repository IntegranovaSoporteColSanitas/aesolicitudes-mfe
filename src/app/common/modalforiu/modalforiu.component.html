    <genericsiu *ngIf="selector=='genericsiu'"></genericsiu>

    <imes-solicitud-siu-modmarcacarnet *ngIf="selector=='imes-solicitud-siu-modmarcacarnet'"></imes-solicitud-siu-modmarcacarnet>
    <imes-gs-siu-tgseleccontratoasoc *ngIf="selector=='imes-gs-siu-tgseleccontratoasoc'"></imes-gs-siu-tgseleccontratoasoc>
    <imes-usuario-siu-tmodificarattr *ngIf="selector=='imes-usuario-siu-tmodificarattr'"></imes-usuario-siu-tmodificarattr>
    <imes-persona-siu-teliminar *ngIf="selector=='imes-persona-siu-teliminar'"></imes-persona-siu-teliminar>
    <imes-usuario-siu-tcrearomodanexomat *ngIf="selector=='imes-usuario-siu-tcrearomodanexomat'"></imes-usuario-siu-tcrearomodanexomat>
    <imes-usuario-siu-tcrearomodanexoneo *ngIf="selector=='imes-usuario-siu-tcrearomodanexoneo'"></imes-usuario-siu-tcrearomodanexoneo>

</p-dialog>
